services:
  nginx:
    image: nginx:alpine
    container_name: gspe-nginx
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      - db

  app_blue:
    image: ${APP_IMAGE:-ghcr.io/alfimaulanaa/gspe-deployment:latest}
    container_name: gspe-app-blue
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gspe_admin}:${POSTGRES_PASSWORD:-gspe_password}@db:5432/${POSTGRES_DB:-gspe_deployment}?schema=public
      - NEXT_TELEMETRY_DISABLED=1
      - APP_VERSION=${APP_VERSION:-v1.0.0}
      - NEXT_PUBLIC_APP_VERSION=${APP_VERSION:-v1.0.0}
    depends_on:
      db:
        condition: service_healthy

  app_green:
    image: ${APP_IMAGE:-ghcr.io/alfimaulanaa/gspe-deployment:latest}
    container_name: gspe-app-green
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gspe_admin}:${POSTGRES_PASSWORD:-gspe_password}@db:5432/${POSTGRES_DB:-gspe_deployment}?schema=public
      - NEXT_TELEMETRY_DISABLED=1
      - APP_VERSION=${APP_VERSION:-v1.0.0}
      - NEXT_PUBLIC_APP_VERSION=${APP_VERSION:-v1.0.0}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: gspe-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-gspe_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-gspe_password}
      - POSTGRES_DB=${POSTGRES_DB:-gspe_deployment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
