name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, master, staging]
  push:
    branches: [main, master, staging]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/alfimaulanaa/gspe-deployment

jobs:
  verify:
    name: Test application and database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gspe_test?schema=public
      NEXT_TELEMETRY_DISABLED: 1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gspe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gspe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:ci

      - name: Audit critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Initialize test database
        run: |
          npx prisma db push
          npm run seed

      - name: Build application
        run: npm run build

      - name: Functional smoke test
        run: |
          set -euo pipefail
          node .next/standalone/server.js >"$RUNNER_TEMP/gspe-app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ \
              --output "$RUNNER_TEMP/homepage.html"; then
              grep --quiet 'NEXASTORE' "$RUNNER_TEMP/homepage.html"
              exit
            fi
            sleep 2
          done

          cat "$RUNNER_TEMP/gspe-app.log"
          exit 1

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  # ========================================================
  # AUTOMATIC SEMVER TAGGING (HANYA SAAT PUSH KE MAIN/MASTER)
  # ========================================================
  tag-version:
    name: Determine and create SemVer Tag
    needs: [verify, codeql]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.calc_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'

      - name: Bump version and push tag
        id: tag_action
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch
          RELEASE_BRANCHES: main,master

      - name: Resolve final version string
        id: calc_version
        run: |
          NEW_TAG="${{ steps.tag_action.outputs.new_tag }}"
          CURR_TAG="${{ steps.tag_action.outputs.tag }}"
          FINAL="${NEW_TAG:-${CURR_TAG:-v1.0.0}}"
          echo "version=$FINAL" >> "$GITHUB_OUTPUT"
          echo "Selected version: $FINAL"

  # ========================================================
  # BUILD & PUBLISH CONTAINER (HANYA SAAT PUSH KE MAIN/MASTER)
  # ========================================================
  build-and-push:
    name: Build and publish container
    needs: [verify, codeql, tag-version]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ needs.tag-version.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ needs.tag-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # PRODUCTION DEPLOYMENT (HANYA SAAT PUSH KE MAIN/MASTER)
  # ========================================================
  deploy-production:
    name: Deploy to Production Server
    needs: [build-and-push, tag-version]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: [self-hosted, linux, X64, deployment]
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      APP_IMAGE: ghcr.io/alfimaulanaa/gspe-deployment:${{ github.sha }}
      APP_VERSION: ${{ needs.tag-version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v7

      - name: Deploy production container (Zero-Downtime Blue/Green & Auto-Rollback)
        run: |
          chmod +x scripts/deploy-production.sh
          ./scripts/deploy-production.sh

  smoke-test-production:
    name: Post-deployment smoke test (Production)
    needs: deploy-production
    uses: ./.github/workflows/performance-test.yml
    with:
      target_url: http://127.0.0.1:3000
      profile: smoke

  # ========================================================
  # PUBLISH GITHUB RELEASE
  # ========================================================
  publish-github-release:
    name: Publish GitHub Release
    needs: [tag-version, smoke-test-production]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag-version.outputs.version }}
          name: Release ${{ needs.tag-version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========================================================
  # NOTIFIKASI DISCORD (PUSH KE MAIN ATAU STAGING)
  # ========================================================
  notify:
    name: Discord CI/CD Notification
    needs:
      - verify
      - codeql
      - tag-version
      - build-and-push
      - deploy-production
      - smoke-test-production
      - publish-github-release
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BRANCH_NAME: ${{ github.ref_name }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          DEPLOY_RESULT: ${{ needs.deploy-production.result }}
          SMOKE_RESULT: ${{ needs.smoke-test-production.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.tag-version.outputs.version }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret is not configured, skipping notification."
            exit 0
          fi

          if [ "$BRANCH_NAME" = "staging" ]; then
            # Notifikasi Khusus Staging (Hanya Validasi CI)
            if [ "$VERIFY_RESULT" = "success" ] && [ "$CODEQL_RESULT" = "success" ]; then
              COLOR=5763719
              STATUS_TITLE="✅ Staging CI Passed"
              STATUS_DESC="Semua pemeriksaan linting, type-check, unit tests, dan security scan berhasil di branch staging. Kode siap di-merge ke main."
            else
              COLOR=15548997
              STATUS_TITLE="❌ Staging CI Failed"
              STATUS_DESC="Pemeriksaan CI di branch staging mengalami kegagalan (Verify: $VERIFY_RESULT, CodeQL: $CODEQL_RESULT)."
            fi
            ENV_LABEL="Staging (CI Validation Only)"
          else
            # Notifikasi Khusus Production (Rilis Penuh & Smoke Test)
            if [ "$DEPLOY_RESULT" = "success" ] && [ "$SMOKE_RESULT" = "success" ]; then
              COLOR=5763719
              STATUS_TITLE="🚀 Production Deployment Succeeded"
              if [ -n "$RELEASE_TAG" ]; then
                STATUS_DESC="Aplikasi versi $RELEASE_TAG berhasil dideploy via Zero-Downtime Blue/Green di Port 3000."
              else
                STATUS_DESC="Aplikasi berhasil diverifikasi, lolos scan Trivy, dan dideploy via Zero-Downtime Blue/Green di Port 3000."
              fi
            else
              COLOR=15548997
              STATUS_TITLE="❌ Production Deployment Failed"
              STATUS_DESC="Terjadi kegagalan pada pipeline produksi (Verify: $VERIFY_RESULT, Deploy: $DEPLOY_RESULT, Smoke: $SMOKE_RESULT). Jika kegagalan saat booting, Automated Rollback mengamankan kontainer aktif."
            fi
            ENV_LABEL="Production (Port 3000 - Zero-Downtime)"
          fi

          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          CLEAN_MSG=$(echo "$COMMIT_MSG" | head -n 1 | tr -d '"\\')
          TAG_VAL="${RELEASE_TAG:-$SHORT_SHA}"

          PAYLOAD=$(jq -n \
            --arg title "$STATUS_TITLE" \
            --arg desc "$STATUS_DESC" \
            --arg color "$COLOR" \
            --arg repo "${{ github.repository }}" \
            --arg branch "$BRANCH_NAME" \
            --arg env "$ENV_LABEL" \
            --arg author "$COMMIT_AUTHOR" \
            --arg tag "$TAG_VAL" \
            --arg commit "[$SHORT_SHA] $CLEAN_MSG" \
            --arg run_url "$RUN_URL" \
            --arg ts "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              username: "GSPE CI/CD Bot",
              avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              embeds: [
                {
                  title: $title,
                  description: $desc,
                  color: ($color | tonumber),
                  fields: [
                    { name: "Repository", value: $repo, inline: true },
                    { name: "Pipeline Role", value: $env, inline: true },
                    { name: "Branch", value: $branch, inline: true },
                    { name: "Release / Tag", value: $tag, inline: true },
                    { name: "Author", value: $author, inline: true },
                    { name: "Commit", value: $commit, inline: false },
                    { name: "Pipeline Logs", value: ("[Lihat Detail Run di GitHub Actions](" + $run_url + ")"), inline: false }
                  ],
                  footer: { text: "GSPE DevOps Enterprise · Containment Server" },
                  timestamp: $ts
                }
              ]
            }')

          curl -s -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"
