name: CI/CD Pipeline (Dual Deployment - AWS & Raspi)

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # SANGAT PENTING: Membangun image untuk kedua arsitektur
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gspe-deployment:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # JOB 1: Deploy ke AWS Lightsail (X64)
  deploy-aws:
    needs: build-and-push
    runs-on: [self-hosted, linux, X64]
    steps:
      - name: Execution on AWS Lightsail
        run: |
          mkdir -p ~/GSPE-Deployment && cd ~/GSPE-Deployment
          if [ ! -d ".git" ]; then
            git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
          else
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch origin main
            git reset --hard origin/main
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          echo "Waiting for DB..."
          sleep 15
          docker exec gspe-app npx prisma db push --accept-data-loss
          docker exec gspe-app npx prisma db seed

  # JOB 2: Deploy ke Nexabrick / Raspberry Pi (ARM64)
  deploy-raspi:
    needs: build-and-push
    runs-on: [self-hosted, linux, arm64]
    steps:
      - name: Execution on Raspberry Pi
        run: |
          mkdir -p ~/GSPE-Deployment && cd ~/GSPE-Deployment
          if [ ! -d ".git" ]; then
            git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
          else
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch origin main
            git reset --hard origin/main
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          echo "Waiting for DB..."
          sleep 15
          docker exec gspe-app npx prisma db push --accept-data-loss
          docker exec gspe-app npx prisma db seed