name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, master, staging]
  push:
    branches: [main, master, staging]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/alfimaulanaa/gspe-deployment

jobs:
  verify:
    name: Test application and database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gspe_test?schema=public
      NEXT_TELEMETRY_DISABLED: 1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gspe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gspe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:ci

      - name: Audit critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Initialize test database
        run: |
          npx prisma db push
          npm run seed

      - name: Build application
        run: npm run build

      - name: Functional smoke test
        run: |
          set -euo pipefail
          node .next/standalone/server.js >"$RUNNER_TEMP/gspe-app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ \
              --output "$RUNNER_TEMP/homepage.html"; then
              grep --quiet 'NEXASTORE' "$RUNNER_TEMP/homepage.html"
              exit
            fi
            sleep 2
          done

          cat "$RUNNER_TEMP/gspe-app.log"
          exit 1

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  build-and-push:
    name: Build and publish container
    needs: [verify, codeql]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Determine container image tags
        id: meta
        run: |
          if [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "tags=${{ env.IMAGE_NAME }}:staging,${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ env.IMAGE_NAME }}:latest,${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # STAGING DEPLOYMENT (Dipicu HANYA saat push ke staging)
  # ========================================================
  deploy-staging:
    name: Deploy to Staging Server
    needs: build-and-push
    if: github.ref == 'refs/heads/staging'
    runs-on: [self-hosted, linux, X64, staging]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      APP_IMAGE: ghcr.io/alfimaulanaa/gspe-deployment:${{ github.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v7

      - name: Deploy staging container image
        run: |
          set -euo pipefail
          deploy_dir="$HOME/GSPE-Deployment-Staging"
          mkdir -p "$deploy_dir"
          test -f "$deploy_dir/.env"
          install -m 0644 docker-compose.staging.yml "$deploy_dir/docker-compose.yml"
          cd "$deploy_dir"

          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          export APP_IMAGE
          docker compose pull app
          docker compose up -d --remove-orphans
          docker exec gspe-app-staging npx prisma db push

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3001/ >/dev/null; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done

          docker compose logs app
          exit 1

  smoke-test-staging:
    name: Post-deployment smoke test (Staging)
    needs: deploy-staging
    uses: ./.github/workflows/performance-test.yml
    with:
      target_url: http://127.0.0.1:3001
      profile: smoke
      runner_tag: staging

  # ========================================================
  # PRODUCTION DEPLOYMENT (Dipicu HANYA saat push ke main)
  # ========================================================
  deploy-production:
    name: Deploy to Production Server
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, X64, production]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      APP_IMAGE: ghcr.io/alfimaulanaa/gspe-deployment:${{ github.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v7

      - name: Deploy production container image
        run: |
          set -euo pipefail
          deploy_dir="$HOME/GSPE-Deployment"
          test -f "$deploy_dir/.env"
          install -m 0644 docker-compose.yml "$deploy_dir/docker-compose.yml"
          cd "$deploy_dir"

          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          export APP_IMAGE
          docker compose pull app
          docker compose up -d --remove-orphans
          docker exec gspe-app npx prisma db push

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done

          docker compose logs app
          exit 1

  smoke-test-production:
    name: Post-deployment smoke test (Production)
    needs: deploy-production
    uses: ./.github/workflows/performance-test.yml
    with:
      target_url: http://127.0.0.1:3000
      profile: smoke
      runner_tag: production

  # ========================================================
  # NOTIFIKASI DISCORD
  # ========================================================
  notify:
    name: Discord Deployment Notification
    needs:
      - verify
      - codeql
      - build-and-push
      - deploy-staging
      - smoke-test-staging
      - deploy-production
      - smoke-test-production
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BRANCH_NAME: ${{ github.ref_name }}
          STAGING_DEPLOY: ${{ needs.deploy-staging.result }}
          STAGING_SMOKE: ${{ needs.smoke-test-staging.result }}
          PROD_DEPLOY: ${{ needs.deploy-production.result }}
          PROD_SMOKE: ${{ needs.smoke-test-production.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret is not configured, skipping notification."
            exit 0
          fi

          IS_SUCCESS="false"
          TARGET_ENV="Unknown"
          PORT_INFO=""

          if [ "$BRANCH_NAME" = "staging" ]; then
            TARGET_ENV="Staging"
            PORT_INFO="Port 3001"
            if [ "$STAGING_DEPLOY" = "success" ] && [ "$STAGING_SMOKE" = "success" ]; then
              IS_SUCCESS="true"
            fi
          elif [ "$BRANCH_NAME" = "main" ] || [ "$BRANCH_NAME" = "master" ]; then
            TARGET_ENV="Production"
            PORT_INFO="Port 3000"
            if [ "$PROD_DEPLOY" = "success" ] && [ "$PROD_SMOKE" = "success" ]; then
              IS_SUCCESS="true"
            fi
          fi

          if [ "$IS_SUCCESS" = "true" ]; then
            COLOR=5763719
            STATUS_EMOJI="🚀"
            STATUS_TITLE="Deployment Succeeded ($TARGET_ENV)"
            STATUS_DESC="Aplikasi berhasil dibangun, diverifikasi, dan dideploy ke lingkungan $TARGET_ENV ($PORT_INFO)."
          else
            COLOR=15548997
            STATUS_EMOJI="❌"
            STATUS_TITLE="Deployment Failed ($TARGET_ENV)"
            STATUS_DESC="Terjadi kendala pada pipeline ($TARGET_ENV). Silakan tinjau log eksekusi."
          fi

          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          CLEAN_MSG=$(echo "$COMMIT_MSG" | head -n 1 | tr -d '"\\')

          PAYLOAD=$(jq -n \
            --arg title "$STATUS_EMOJI $STATUS_TITLE" \
            --arg desc "$STATUS_DESC" \
            --arg color "$COLOR" \
            --arg repo "${{ github.repository }}" \
            --arg branch "$BRANCH_NAME" \
            --arg env "$TARGET_ENV" \
            --arg port "$PORT_INFO" \
            --arg author "$COMMIT_AUTHOR" \
            --arg commit "[$SHORT_SHA] $CLEAN_MSG" \
            --arg run_url "$RUN_URL" \
            --arg ts "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              username: "GSPE CI/CD Bot",
              avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              embeds: [
                {
                  title: $title,
                  description: $desc,
                  color: ($color | tonumber),
                  fields: [
                    { name: "Repository", value: $repo, inline: true },
                    { name: "Environment", value: ($env + " (" + $port + ")"), inline: true },
                    { name: "Branch", value: $branch, inline: true },
                    { name: "Author", value: $author, inline: true },
                    { name: "Commit", value: $commit, inline: false },
                    { name: "Pipeline Logs", value: ("[Lihat Detail Run di GitHub Actions](" + $run_url + ")"), inline: false }
                  ],
                  footer: { text: "GSPE DevOps Enterprise · Containment Server" },
                  timestamp: $ts
                }
              ]
            }')

          curl -s -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"
