name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/alfimaulanaa/gspe-deployment

jobs:
  verify:
    name: Test application and database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gspe_test?schema=public
      NEXT_TELEMETRY_DISABLED: 1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gspe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gspe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Audit critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Initialize test database
        run: |
          npx prisma db push
          npm run seed

      - name: Build application
        run: npm run build

      - name: Functional smoke test
        run: |
          set -euo pipefail
          node .next/standalone/server.js >"$RUNNER_TEMP/gspe-app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ \
              --output "$RUNNER_TEMP/homepage.html"; then
              grep --quiet 'NEXASTORE' "$RUNNER_TEMP/homepage.html"
              exit
            fi
            sleep 2
          done

          cat "$RUNNER_TEMP/gspe-app.log"
          exit 1

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  build-and-push:
    name: Build and publish container
    needs: [verify, codeql]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-server:
    name: Deploy to containment server
    needs: build-and-push
    runs-on: [self-hosted, linux, X64, deployment]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      APP_IMAGE: ghcr.io/alfimaulanaa/gspe-deployment:${{ github.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v7

      - name: Deploy tested image
        run: |
          set -euo pipefail
          deploy_dir="$HOME/GSPE-Deployment"
          test -f "$deploy_dir/.env"
          install -m 0644 docker-compose.yml "$deploy_dir/docker-compose.yml"
          cd "$deploy_dir"

          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          export APP_IMAGE
          docker compose pull app
          docker compose up -d --remove-orphans
          docker exec gspe-app npx prisma db push

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done

          docker compose logs app
          exit 1

  smoke-test-server:
    name: Post-deployment smoke test
    needs: deploy-server
    uses: ./.github/workflows/performance-test.yml
    with:
      target_url: http://127.0.0.1:3000
      profile: smoke
