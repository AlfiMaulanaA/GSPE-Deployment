name: CI/CD Pipeline (Registry-First)

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'arm64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/alfimaulanaa/gspe-deployment:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Execution on Raspi
        run: |
          cd ~/GSPE-Deployment
          
          # 1. Konfigurasi token DULU agar punya izin akses
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          # 2. Paksa sinkronisasi dengan GitHub
          git fetch origin main
          git reset --hard origin/main
          
          # 3. Login ke registry
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # 4. Update container
          docker compose pull
          docker compose up -d
          
          # 5. Tunggu database siap
          echo "Waiting for database..."
          sleep 10
          
          # 6. Database Update
          docker exec gspe-app npx prisma db push --accept-data-loss
          docker exec gspe-app npx prisma db seed
