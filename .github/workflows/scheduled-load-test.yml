name: Scheduled Load Test

on:
  schedule:
    # Every Sunday at 05:12 UTC (12:12 WIB).
    - cron: "12 5 * * 0"
  workflow_dispatch:

jobs:
  server:
    name: Containment server load test
    uses: ./.github/workflows/performance-test.yml
    with:
      target_url: http://127.0.0.1:3000
      profile: load
