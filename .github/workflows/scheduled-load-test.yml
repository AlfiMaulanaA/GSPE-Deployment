name: Scheduled Load Test

on:
  schedule:
    # Every Sunday at 05:12 UTC (12:12 WIB).
    - cron: "12 5 * * 0"
  workflow_dispatch:

jobs:
  aws:
    name: AWS production load test
    if: vars.AWS_APP_URL != ''
    uses: ./.github/workflows/performance-test.yml
    with:
      target_url: ${{ vars.AWS_APP_URL }}
      profile: load

  raspi:
    name: Raspberry Pi production load test
    if: vars.RASPI_APP_URL != ''
    uses: ./.github/workflows/performance-test.yml
    with:
      target_url: ${{ vars.RASPI_APP_URL }}
      profile: load
